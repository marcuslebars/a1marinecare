name: Marina customer follow-ups

# Every 20 minutes (GitHub often runs hourly crons 30-70 min late, especially on
# weekends). The endpoint decides what's due, stamps everything it sends, and only
# texts / calls during Toronto civil hours, so extra runs are harmless.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Send due nudges and reminders
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST "https://a1marinecare.ca/api/retell/followups" \
            -H "x-a1-cron-secret: ${{ secrets.DIGEST_CRON_SECRET }}")
          cat /tmp/out.json; echo
          test "$code" = "200"
